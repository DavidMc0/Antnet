# Antnet loader on nginx: the root host and every site subdomain serve the same static shell.
# Install as /etc/nginx/sites-available/antnet and link it into sites-enabled (deploy/README.md).
# The site content never comes from here: the shell fetches it from the Autonomi network.

server {
    listen 80;
    listen [::]:80;
    server_name antnet.autonomirror.com *.antnet.autonomirror.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name antnet.autonomirror.com *.antnet.autonomirror.com;

    # Wildcard certificate for antnet.autonomirror.com and *.antnet.autonomirror.com,
    # installed and renewed by acme.sh (deploy/README.md).
    ssl_certificate     /etc/ssl/antnet/fullchain.pem;
    ssl_certificate_key /etc/ssl/antnet/key.pem;

    root /var/www/antnet/current;
    server_tokens off;

    # Hashed build assets (shell script, styles, SDK and its WASM): cache for good.
    location /_autonomi/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The service worker keeps a stable name, so browsers must always revalidate it.
    location = /autonomi-loader-sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Everything else is the shell. On a site subdomain the shell installs the site, and from
    # then on the service worker answers instead of this server.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /index.html =404;
    }
}
